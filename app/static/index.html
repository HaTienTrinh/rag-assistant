<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Assistant - Trợ lý tài liệu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/static/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- App Shell Layout -->
  <div id="app-view" class="app-layout">

    <!-- Mobile Topbar (< 900px) -->
    <header class="mobile-topbar">
      <button id="mobile-toggle-btn" class="icon-btn" aria-label="Mở menu điều hướng">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div id="mobile-brand-title" class="mobile-brand-title">RAG Assistant</div>
      <button id="mobile-new-chat-btn" class="icon-btn" aria-label="Tạo hội thoại mới">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </header>

    <!-- Mobile Backdrop -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <!-- Sidebar cố định bên trái (Dựng bằng JS qua ui/sidebar.js) -->
    <aside id="sidebar" class="sidebar"></aside>

    <!-- Vùng nội dung chính: Màn Chat -->
    <main id="main-content" class="main-content">
      <section id="chat-view" class="chat-layout">
        <div id="messages" class="messages-container" aria-live="polite"></div>
        <div class="composer-container">
          <form id="chat-form" class="composer-form">
            <div class="composer-input-wrap">
              <textarea id="question" class="composer-input" rows="1" placeholder="Nhập câu hỏi về tài liệu... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
            </div>
            <button id="send-btn" type="submit" class="btn btn-primary send-btn" aria-label="Gửi câu hỏi">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/static/js/pages/chat.js"></script>
</body>
</html>
